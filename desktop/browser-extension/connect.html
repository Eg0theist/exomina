<!doctype html>
<html><head><meta charset="utf-8"><title>Connect Exomina</title><link rel="stylesheet" href="connect.css"></head>
<body><main><h1>Connect your browser</h1><p>Exomina opens a separate tab for each chat, using the sign-ins already in this browser profile.</p><p>Browser actions and page reads still follow Exomina’s approvals. Passwords and cookies stay in your browser.</p><form id="connect"><label for="code">Connection code from Exomina → Tools</label><input id="code" autocomplete="off" spellcheck="false" required><button type="submit">Connect</button></form><p id="status" role="status"></p><button id="disconnect" type="button">Disconnect this browser</button></main><script type="module" src="connect.js"></script></body></html>
