version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    versioning-strategy: increase
    groups:
      compatible-security-maintenance:
        patterns: ['*']
        update-types: [patch, minor]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      # Native provider executables use reviewed versions and hashes across all
      # targets. Update those pins together through runtime qualification.
      - dependency-name: '@anthropic-ai/claude-code-*'
      - dependency-name: '@xai-official/grok-*'
