name: Refresh dependency graph
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-graph-${{ github.ref }}
  cancel-in-progress: false
jobs:
  submit:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Submit resolved npm dependencies from the current protected source
        uses: advanced-security/component-detection-dependency-submission-action@a02aeda7a175ad4dd38a13c4d3ff2df9da8f2cf0
        with:
          filePath: '.'
          detectorsCategories: Npm
          fail-on-empty: 'true'
          correlator: npm-lockfile
