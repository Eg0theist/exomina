name: Native beta packages
on:
  push:
    branches: [accessibility-beta]
  workflow_dispatch:
    inputs:
      native_family:
        description: Native family to rebuild and qualify
        type: choice
        required: true
        default: all
        options: [all, linux, linux-x64, macos]
concurrency:
  group: native-beta-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native-package:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event.inputs.native_family == 'linux-x64' && '[{"runner":"ubuntu-24.04","platform":"linux","arch":"x64"}]' || github.event.inputs.native_family == 'linux' && '[{"runner":"ubuntu-24.04","platform":"linux","arch":"x64"},{"runner":"ubuntu-24.04-arm","platform":"linux","arch":"arm64"}]' || github.event.inputs.native_family == 'macos' && '[{"runner":"macos-15","platform":"darwin","arch":"arm64"},{"runner":"macos-26-intel","platform":"darwin","arch":"x64"}]' || '[{"runner":"macos-15","platform":"darwin","arch":"arm64"},{"runner":"macos-26-intel","platform":"darwin","arch":"x64"},{"runner":"ubuntu-24.04","platform":"linux","arch":"x64"},{"runner":"ubuntu-24.04-arm","platform":"linux","arch":"arm64"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      TEMP: ${{ github.workspace }}/.runtime-work/temp
      TMP: ${{ github.workspace }}/.runtime-work/temp
      TMPDIR: ${{ github.workspace }}/.runtime-work/temp
    steps:
      - uses: actions/checkout@v4
      - name: Use workspace-owned temporary files
        run: mkdir -p "$TMPDIR"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Confirm native runner architecture
        run: node -e "if(process.platform!=='${{ matrix.platform }}'||process.arch!=='${{ matrix.arch }}')throw Error('Wrong native runner target')"
      - run: npm ci --ignore-scripts
      - name: Install the pinned native Electron program
        run: node node_modules/electron/install.js
      - name: Check source and permissions
        run: node --test test/portability.test.mjs test/portability-native.test.mjs test/native-runtime-preparation.test.mjs test/native-qa-paths.test.mjs test/native-qa-cdp.test.mjs test/permissions.test.mjs test/profile-storage.test.mjs test/secret-storage.test.mjs test/credential-startup.test.mjs test/app-paths.test.mjs test/updates.test.mjs test/startup-diagnostics.test.mjs
      - name: Install Linux build and display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libsecret-1-dev xvfb libgtk-3-0t64 libnss3 libasound2t64 libgbm1
      - name: Build native package
        id: build_native
        run: node scripts/package-cross-platform.mjs ${{ matrix.platform }} --ci-installers
      - name: Mount, copy, launch and remove macOS app
        id: macos_install
        if: always() && runner.os == 'macOS' && steps.build_native.outcome == 'success'
        shell: bash
        run: |
          installer=$(find release-darwin -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$installer"
          node scripts/qa-native-install.mjs --installer "$installer" --output .native-qa-reports/macos
      - name: Install, launch and remove Linux DEB
        id: deb_install
        if: always() && runner.os == 'Linux' && steps.build_native.outcome == 'success'
        shell: bash
        run: |
          installer=$(find release-linux -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$installer"
          xvfb-run -a node scripts/qa-native-install.mjs --installer "$installer" --output .native-qa-reports/linux-deb
      - name: Upload qualified macOS installers
        uses: actions/upload-artifact@v4
        if: always() && steps.macos_install.outcome == 'success'
        with:
          name: exomina-beta-darwin-${{ matrix.arch }}-installers
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
          path: |
            release-darwin/*.dmg
      - name: Upload qualified DEB installer
        uses: actions/upload-artifact@v4
        if: always() && steps.deb_install.outcome == 'success'
        with:
          name: exomina-beta-linux-${{ matrix.arch }}-deb-installer
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
          path: release-linux/*.deb
      - name: Upload sanitized native qualification reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exomina-beta-${{ matrix.platform }}-${{ matrix.arch }}-qa
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            .native-qa-reports/**/*.json
            .native-qa-reports/**/*.png
