name: Release security checks
on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 6 * * 1'
permissions:
  contents: read
concurrency:
  group: release-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Reject known dependency vulnerabilities at every severity
        run: npm audit --audit-level=low --registry=https://registry.npmjs.org
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26
        with:
          category: /language:javascript-typescript
